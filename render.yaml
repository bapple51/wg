services:
  - type: web
    name: forgejo-wg-proxy
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # standard = $25/mo. "starter" ($7/mo) is plenty for a byte-forwarding proxy,
    # but Claude Code wants memory: stay on standard if you enable the terminal.
    plan: standard
    region: frankfurt
    numInstances: 1
    autoDeploy: true
    # Forgejo's health endpoint, reached through the tunnel.
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: "10000"

      # The entire WireGuard config, raw multiline or base64.
      # Secret: Render prompts for it when you create the Blueprint.
      # The [TCPClientTunnel] section is added automatically from FORGEJO_TARGET.
      - key: WG_CONFIG
        sync: false

      # --- Forgejo ---
      - key: FORGEJO_TARGET
        value: 192.168.1.156:3000
      - key: FORGEJO_DEFAULT_BRANCH
        value: main

      # --- Claude Code terminal at /claude/ ---
      # "on" publishes an interactive shell into your home LAN, gated only by
      # the basic-auth password below. Leave it "off" unless you want that.
      - key: CLAUDE_TERMINAL
        value: "off"
      - key: CLAUDE_TERM_USER
        value: claude
      # Required when CLAUDE_TERMINAL=on. Generate a long random one.
      - key: CLAUDE_TERM_PASSWORD
        sync: false
      # How Claude authenticates. Set exactly one.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Subscription (Pro/Max) instead of an API key: create the token locally
      # with `claude setup-token`, then set it here and drop ANTHROPIC_API_KEY.
      # - key: CLAUDE_CODE_OAUTH_TOKEN
      #   sync: false

      # --- unattended tasks ---
      # Flags claude-task passes to `claude --print`. The default bypasses all
      # permission checks, because a cron job has nobody to approve tool calls.
      # Narrow it if you can, e.g.
      #   --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*)"
      # - key: CLAUDE_TASK_FLAGS
      #   value: --dangerously-skip-permissions
      # Days of task logs to keep in /data/logs.
      - key: CLAUDE_TASK_LOG_DAYS
        value: "14"

      # Lets git clone/push against Forgejo through the tunnel without
      # prompting. Token: Forgejo -> Settings -> Applications.
      - key: FORGEJO_USER
        sync: false
      - key: FORGEJO_TOKEN
        sync: false

      # Optional fallback if you'd rather not use WG_CONFIG: uncomment these
      # and the entrypoint will assemble the config from them instead.
      # - key: WG_PRIVATE_KEY
      #   sync: false
      # - key: WG_PEER_PUBLIC_KEY
      #   value: n4sIMm33hzPjtVA4keizBz7VvntY/GduwBWY2G6KEAs=
      # - key: WG_ENDPOINT
      #   value: shitpanini.duckdns.org:51820
      # - key: WG_ADDRESS
      #   value: 10.0.0.5/32
      # - key: WG_DNS
      #   value: 192.168.1.105
      # - key: WG_MTU
      #   value: "1280"
      # - key: WG_ALLOWED_IPS
      #   value: 192.168.1.0/24, 10.0.0.0/24
      # - key: WG_KEEPALIVE
      #   value: "25"

    # Persistent disk. /workspace and ~/.claude are both symlinked onto it at
    # boot, so repos, Claude's conversation history and any interactive login
    # all survive deploys and restarts.
    # Render mounts it root-owned, which is why the entrypoint starts as root
    # solely to chown it and then drops to uid 10001 via su-exec.
    disk:
      name: claude-data
      mountPath: /data
      sizeGB: 15
